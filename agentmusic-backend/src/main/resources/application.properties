spring.application.name=AgentMusic
spring.config.import=optional:file:./application-local.properties

openai.chat.model-id=${OPENAI_MODEL:gpt-4o}
spotify.bridge.enabled=${SPOTIFY_BRIDGE_ENABLED:false}
spotify.bridge.client-id=${SPOTIFY_CLIENT_ID:}
spotify.bridge.client-secret=${SPOTIFY_CLIENT_SECRET:}
spotify.bridge.redirect-uri=${SPOTIFY_REDIRECT_URI:}
spotify.bridge.system-user-id=${SPOTIFY_BRIDGE_SYSTEM_USER_ID:bridge-user}
spotify.bridge.default-device-id=${SPOTIFY_BRIDGE_DEVICE_ID:}
