spring.application.name=AgentMusic
spring.config.import=optional:file:./application-local.properties,optional:file:./agentmusic-backend/application-local.properties

openai.api.key=${OPENAI_API_KEY:}
openai.chat.model-id=${OPENAI_MODEL:gpt-4o}
agent.chat.live-llm-enabled=false
agent.chat.system-prompt=You are AgentMusic, a concise music assistant. Answer clearly, stay practical, and focus on helping the user discover or control music.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
spotify.bridge.enabled=${SPOTIFY_BRIDGE_ENABLED:false}
spotify.bridge.client-id=${SPOTIFY_CLIENT_ID:}
spotify.bridge.client-secret=${SPOTIFY_CLIENT_SECRET:}
spotify.bridge.redirect-uri=${SPOTIFY_REDIRECT_URI:}
spotify.bridge.system-user-id=${SPOTIFY_BRIDGE_SYSTEM_USER_ID:bridge-user}
spotify.bridge.default-device-id=${SPOTIFY_BRIDGE_DEVICE_ID:}
agentmusic.persistence.mode=${APP_PERSISTENCE_MODE:memory}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/agentmusic?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
mybatis.mapper-locations=classpath*:mybatis/*.xml
mybatis.type-aliases-package=com.agentmusic.agentmusic_backend.domain,com.agentmusic.agentmusic_backend.persistence.mybatis.model
mybatis.configuration.map-underscore-to-camel-case=true
